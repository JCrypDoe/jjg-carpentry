<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Roof shape -->
  <polygon points="32,6 6,30 58,30" fill="#0a1628"/>
  <polygon points="32,6 6,30 58,30" fill="none" stroke="#c9a84c" stroke-width="2"/>
  <!-- Roof tiles -->
  <rect x="10" y="32" width="44" height="22" rx="2" fill="#0a1628"/>
  <!-- Tile lines horizontal -->
  <line x1="10" y1="39" x2="54" y2="39" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
  <line x1="10" y1="46" x2="54" y2="46" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
  <!-- Tile lines vertical -->
  <line x1="21" y1="32" x2="21" y2="54" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
  <line x1="32" y1="32" x2="32" y2="54" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
  <line x1="43" y1="32" x2="43" y2="54" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
  <!-- Ridge cap -->
  <rect x="24" y="4" width="16" height="6" rx="3" fill="#c9a84c"/>
  <!-- Chimney -->
  <rect x="42" y="14" width="8" height="16" rx="1" fill="#c9a84c" opacity="0.8"/>
</svg>