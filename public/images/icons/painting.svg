<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Paint roller -->
  <rect x="10" y="14" width="36" height="16" rx="8" fill="#0a1628"/>
  <rect x="14" y="18" width="28" height="8" rx="4" fill="#c9a84c"/>
  <!-- Roller handle -->
  <rect x="44" y="14" width="4" height="28" rx="2" fill="#0a1628"/>
  <rect x="44" y="40" width="12" height="4" rx="2" fill="#0a1628"/>
  <!-- Paint drips -->
  <rect x="16" y="30" width="4" height="10" rx="2" fill="#c9a84c" opacity="0.7"/>
  <rect x="24" y="30" width="4" height="14" rx="2" fill="#c9a84c" opacity="0.5"/>
  <rect x="32" y="30" width="4" height="8" rx="2" fill="#c9a84c" opacity="0.6"/>
  <!-- Paint surface -->
  <rect x="8" y="48" width="40" height="4" rx="2" fill="#c9a84c" opacity="0.3"/>
</svg>