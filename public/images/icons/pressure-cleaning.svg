<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Pressure gun body -->
  <rect x="8" y="20" width="28" height="10" rx="4" fill="#0a1628"/>
  <rect x="32" y="22" width="16" height="6" rx="3" fill="#c9a84c"/>
  <!-- Handle -->
  <rect x="16" y="28" width="6" height="16" rx="3" fill="#0a1628"/>
  <!-- Nozzle tip -->
  <polygon points="48,22 56,24 48,28" fill="#0a1628"/>
  <!-- Water spray lines -->
  <line x1="56" y1="20" x2="62" y2="14" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="56" y1="25" x2="63" y2="25" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="56" y1="30" x2="62" y2="36" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Water drops -->
  <circle cx="58" cy="16" r="2" fill="#c9a84c" opacity="0.4"/>
  <circle cx="60" cy="38" r="1.5" fill="#c9a84c" opacity="0.3"/>
  <!-- Hose -->
  <path d="M16 44 Q10 50 8 56" stroke="#0a1628" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>