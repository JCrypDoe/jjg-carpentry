<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Toolbox body -->
  <rect x="6" y="28" width="52" height="28" rx="4" fill="#0a1628"/>
  <!-- Toolbox lid -->
  <rect x="6" y="24" width="52" height="8" rx="3" fill="#c9a84c"/>
  <!-- Handle -->
  <path d="M22 24 Q22 14 32 14 Q42 14 42 24" stroke="#0a1628" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Latch -->
  <rect x="28" y="26" width="8" height="4" rx="2" fill="#0a1628"/>
  <!-- Tools inside -->
  <!-- Screwdriver -->
  <rect x="14" y="34" width="3" height="16" rx="1.5" fill="#c9a84c" opacity="0.8"/>
  <rect x="13" y="32" width="5" height="5" rx="1" fill="#c9a84c"/>
  <!-- Wrench -->
  <rect x="22" y="34" width="3" height="16" rx="1.5" fill="#c9a84c" opacity="0.6"/>
  <circle cx="23.5" cy="33" r="4" stroke="#c9a84c" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Hammer -->
  <rect x="32" y="36" width="3" height="14" rx="1.5" fill="#c9a84c" opacity="0.7"/>
  <rect x="28" y="32" width="10" height="6" rx="2" fill="#c9a84c" opacity="0.7"/>
  <!-- Pliers -->
  <line x1="44" y1="34" x2="40" y2="50" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="48" y1="34" x2="44" y2="50" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>