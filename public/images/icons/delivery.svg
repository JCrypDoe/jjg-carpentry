  <line x1="4" y1="34" x2="40" y2="34" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
  <line x1="22" y1="22" x2="22" y2="46" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
  <!-- Wheels -->
  <circle cx="16" cy="48" r="6" fill="#c9a84c"/>
  <circle cx="16" cy="48" r="3" fill="#0a1628"/>
  <circle cx="48" cy="48" r="6" fill="#c9a84c"/>
  <circle cx="48" cy="48" r="3" fill="#0a1628"/>
  <!-- Ground line -->
  <line x1="2" y1="54" x2="62" y2="54" stroke="#c9a84c" stroke-width="1.5" opacity="0.3"/>
  <!-- Speed lines -->
  <line x1="2" y1="28" x2="10" y2="28" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="2" y1="34" x2="8" y2="34" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>