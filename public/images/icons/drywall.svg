<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Wall panel -->
  <rect x="6" y="10" width="52" height="44" rx="3" fill="#0a1628" opacity="0.9"/>
  <!-- Panel seams -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#c9a84c" stroke-width="1.5" opacity="0.5"/>
  <line x1="6" y1="32" x2="58" y2="32" stroke="#c9a84c" stroke-width="1.5" opacity="0.5"/>
  <!-- Putty knife -->
  <rect x="38" y="6" width="6" height="28" rx="1" fill="#c9a84c" transform="rotate(30 38 6)"/>
  <rect x="40" y="4" width="4" height="8" rx="1" fill="#8B6914" transform="rotate(30 40 4)"/>
  <!-- Spackle blob -->
  <ellipse cx="22" cy="22" rx="8" ry="5" fill="#c9a84c" opacity="0.3" transform="rotate(-10 22 22)"/>
  <!-- Texture dots -->
  <circle cx="14" cy="42" r="1.5" fill="#c9a84c" opacity="0.3"/>
  <circle cx="20" cy="46" r="1" fill="#c9a84c" opacity="0.2"/>
  <circle cx="26" cy="42" r="1.5" fill="#c9a84c" opacity="0.3"/>
</svg>