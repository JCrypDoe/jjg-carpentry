<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Workshop background -->
  <rect width="800" height="500" fill="#1a0f05"/>
  <!-- Back wall -->
  <rect x="0" y="0" width="800" height="340" fill="#2a1a0a"/>
  <!-- Tool pegboard on wall -->
  <rect x="50" y="30" width="700" height="200" rx="4" fill="#1a0f05" opacity="0.6"/>
  <!-- Pegboard holes -->
  <g opacity="0.3" fill="#c9a84c">
    <circle cx="80" cy="60" r="3"/><circle cx="110" cy="60" r="3"/><circle cx="140" cy="60" r="3"/>
    <circle cx="170" cy="60" r="3"/><circle cx="200" cy="60" r="3"/><circle cx="230" cy="60" r="3"/>
    <circle cx="80" cy="90" r="3"/><circle cx="110" cy="90" r="3"/><circle cx="140" cy="90" r="3"/>
    <circle cx="170" cy="90" r="3"/><circle cx="200" cy="90" r="3"/><circle cx="230" cy="90" r="3"/>
    <circle cx="570" cy="60" r="3"/><circle cx="600" cy="60" r="3"/><circle cx="630" cy="60" r="3"/>
    <circle cx="660" cy="60" r="3"/><circle cx="690" cy="60" r="3"/><circle cx="720" cy="60" r="3"/>
    <circle cx="570" cy="90" r="3"/><circle cx="600" cy="90" r="3"/><circle cx="630" cy="90" r="3"/>
  </g>
  <!-- Hanging tools on wall -->
  <rect x="90" y="55" width="60" height="8" rx="2" fill="#c9a84c" opacity="0.7"/>
  <rect x="90" y="63" width="8" height="40" rx="2" fill="#8B6914" opacity="0.7"/>
  <rect x="580" y="55" width="8" height="50" rx="2" fill="#8B6914" opacity="0.7"/>
  <circle cx="584" cy="55" r="8" stroke="#c9a84c" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Floor -->
  <rect x="0" y="340" width="800" height="160" fill="#0d0805"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#8B6914" stroke-width="2" opacity="0.4"/>

  <!-- JJG Carpentry sign on wall -->
  <rect x="280" y="40" width="240" height="70" rx="6" fill="#0a1628"/>
  <rect x="284" y="44" width="232" height="62" rx="4" fill="#0a1628" stroke="#c9a84c" stroke-width="2"/>
  <text x="400" y="72" font-family="Arial" font-weight="bold" font-size="18" fill="#c9a84c" text-anchor="middle">JJG CARPENTRY</text>
  <text x="400" y="92" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">LLC</text>

  <!-- Person 1 (left) - standing -->
  <!-- Body/shirt navy -->
  <rect x="120" y="200" width="80" height="120" rx="8" fill="#0a1628"/>
  <!-- Logo on shirt -->
  <rect x="140" y="215" width="24" height="16" rx="2" fill="#c9a84c" opacity="0.8"/>
  <!-- Head -->
  <circle cx="160" cy="185" r="32" fill="#D4956A"/>
  <!-- Hair -->
  <ellipse cx="160" cy="162" rx="32" ry="14" fill="#3a2010"/>
  <!-- Face features -->
  <circle cx="150" cy="183" r="3" fill="#2a1505"/>
  <circle cx="170" cy="183" r="3" fill="#2a1505"/>
  <path d="M150 196 Q160 204 170 196" stroke="#2a1505" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Arms -->
  <rect x="90" y="205" width="32" height="14" rx="7" fill="#0a1628"/>
  <rect x="198" y="205" width="32" height="14" rx="7" fill="#0a1628"/>
  <!-- Hands -->
  <circle cx="86" cy="212" r="10" fill="#D4956A"/>
  <circle cx="234" cy="212" r="10" fill="#D4956A"/>
  <!-- Pants -->
  <rect x="120" y="310" width="36" height="80" rx="4" fill="#1e3a5f"/>
  <rect x="164" y="310" width="36" height="80" rx="4" fill="#1e3a5f"/>
  <!-- Boots -->
  <rect x="116" y="378" width="44" height="20" rx="4" fill="#3a2010"/>
  <rect x="160" y="378" width="44" height="20" rx="4" fill="#3a2010"/>

  <!-- Person 2 (center) - taller, smiling -->
  <rect x="330" y="180" width="90" height="140" rx="8" fill="#0a1628"/>
  <rect x="350" y="195" width="28" height="18" rx="2" fill="#c9a84c" opacity="0.8"/>
  <circle cx="375" cy="162" r="36" fill="#C8845A"/>
  <ellipse cx="375" cy="136" rx="36" ry="16" fill="#1a0f05"/>
  <circle cx="363" cy="160" r="3.5" fill="#1a0505"/>
  <circle cx="387" cy="160" r="3.5" fill="#1a0505"/>
  <path d="M362 175 Q375 185 388 175" stroke="#1a0505" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Beard -->
  <path d="M355 175 Q375 195 395 175" fill="#3a2010" opacity="0.5"/>
  <rect x="295" y="185" width="36" height="16" rx="8" fill="#0a1628"/>
  <rect x="419" y="185" width="36" height="16" rx="8" fill="#0a1628"/>
  <circle cx="291" cy="193" r="11" fill="#C8845A"/>
  <circle cx="459" cy="193" r="11" fill="#C8845A"/>
  <rect x="330" y="308" width="40" height="90" rx="4" fill="#1e3a5f"/>
  <rect x="378" y="308" width="40" height="90" rx="4" fill="#1e3a5f"/>
  <rect x="326" y="386" width="48" height="22" rx="4" fill="#2a1505"/>
  <rect x="374" y="386" width="48" height="22" rx="4" fill="#2a1505"/>

  <!-- Person 3 (right) -->
  <rect x="580" y="205" width="80" height="120" rx="8" fill="#0a1628"/>
  <rect x="598" y="220" width="24" height="16" rx="2" fill="#c9a84c" opacity="0.8"/>
  <circle cx="620" cy="188" r="30" fill="#B87040"/>
  <ellipse cx="620" cy="166" rx="30" ry="13" fill="#0a0500"/>
  <circle cx="610" cy="186" r="3" fill="#1a0505"/>
  <circle cx="630" cy="186" r="3" fill="#1a0505"/>
  <path d="M610 199 Q620 207 630 199" stroke="#1a0505" stroke-width="2" fill="none" stroke-linecap="round"/>
  <rect x="548" y="210" width="34" height="14" rx="7" fill="#0a1628"/>
  <rect x="658" y="210" width="34" height="14" rx="7" fill="#0a1628"/>
  <circle cx="544" cy="217" r="10" fill="#B87040"/>
  <circle cx="696" cy="217" r="10" fill="#B87040"/>
  <rect x="580" y="315" width="36" height="80" rx="4" fill="#1e3a5f"/>
  <rect x="624" y="315" width="36" height="80" rx="4" fill="#1e3a5f"/>
  <rect x="576" y="383" width="44" height="20" rx="4" fill="#2a1505"/>
  <rect x="620" y="383" width="44" height="20" rx="4" fill="#2a1505"/>

  <!-- Tool belts -->
  <rect x="120" y="295" width="80" height="12" rx="4" fill="#8B6914"/>
  <rect x="330" y="295" width="90" height="14" rx="4" fill="#8B6914"/>
  <rect x="580" y="295" width="80" height="12" rx="4" fill="#8B6914"/>

  <!-- Warm overhead lighting -->
  <ellipse cx="400" cy="0" rx="600" ry="200" fill="#c9a84c" opacity="0.04"/>

  <!-- Shadow on floor -->
  <ellipse cx="160" cy="400" rx="50" ry="10" fill="#000" opacity="0.3"/>
  <ellipse cx="375" cy="400" rx="60" ry="12" fill="#000" opacity="0.3"/>
  <ellipse cx="620" cy="400" rx="50" ry="10" fill="#000" opacity="0.3"/>
</svg>