<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login — JJG Carpentry LLC</title>
<link href="/css/style.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
    body { background: linear-gradient(135deg, #0a1628 0%, #1e3a5f 100%); min-height: 100vh; }
    .login-bg-pattern {
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(201,168,76,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(201,168,76,0.04) 0%, transparent 40%);
    }
    .login-tools {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden;
    }
    .tool-icon {
      position: absolute; font-size: 80px; opacity: 0.04;
      animation: float 8s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap .form-control { padding-left: 44px; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--gray-dark); font-size: 16px;
    }
    .password-toggle {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--gray-dark);
      font-size: 16px; padding: 4px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.5); font-size: 13px;
      position: fixed; top: 24px; left: 24px;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--gold); }
  </style>
</head>
<body>
<div class="login-bg-pattern"></div>
<div class="login-tools">
<span class="tool-icon" style="top:10%;left:5%;animation-delay:0s;">🔨</span>
<span class="tool-icon" style="top:60%;left:8%;animation-delay:1s;">🪚</span>
<span class="tool-icon" style="top:20%;right:6%;animation-delay:2s;">🔧</span>
<span class="tool-icon" style="top:70%;right:5%;animation-delay:0.5s;">⚡</span>
<span class="tool-icon" style="top:40%;left:50%;animation-delay:1.5s;">🎨</span>
</div>
<a class="back-link" href="/">
<i class="fas fa-arrow-left"></i> Back to Website
</a>
<div class="login-page">
<div class="login-card">
<div class="login-logo">
<div class="login-logo-icon">JJG</div>
<h2>Admin Portal</h2>
<p>Sign in to manage your job gallery and uploads</p>
</div>
<div class="alert alert-error" id="loginError"></div>
<div class="alert alert-success" id="loginSuccess"></div>
<form id="loginForm">
<div class="form-group">
<label class="form-label">Username</label>
<div class="input-icon-wrap">
<i class="fas fa-user input-icon"></i>
<input autocomplete="username" class="form-control" id="username" placeholder="Enter username" required="" type="text"/>
</div>
</div>
<div class="form-group">
<label class="form-label">Password</label>
<div class="input-icon-wrap" style="position:relative;">
<i class="fas fa-lock input-icon"></i>
<input autocomplete="current-password" class="form-control" id="password" placeholder="Enter password" required="" type="password"/>
<button class="password-toggle" id="pwToggle" type="button">
<i class="fas fa-eye" id="pwIcon"></i>
</button>
</div>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
<input id="rememberMe" style="accent-color:var(--gold);" type="checkbox"/>
          Remember me
        </label>
<a href="#" style="font-size:13px;color:var(--gold);">Forgot password?</a>
</div>
<button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;" type="submit">
<i class="fas fa-sign-in-alt"></i> Sign In
      </button>
</form>
</div>
</div>
<script>
  // Password toggle
  document.getElementById('pwToggle').addEventListener('click', () => {
    const pw = document.getElementById('password');
    const icon = document.getElementById('pwIcon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.className = 'fas fa-eye-slash';
    } else {
      pw.type = 'password';
      icon.className = 'fas fa-eye';
    }
  });

  // Login form
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');
    const sucEl = document.getElementById('loginSuccess');
    errEl.style.display = 'none';
    sucEl.style.display = 'none';

    btn.innerHTML = '<span class="spinner"></span> Signing in...';
    btn.disabled = true;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('jjg_token', data.token);
        localStorage.setItem('jjg_user', data.token ? JSON.parse(atob(data.token.split('.')[1])).username : 'admin');
        sucEl.textContent = 'Login successful! Redirecting...';
        sucEl.style.display = 'block';
        setTimeout(() => window.location.href = '/admin/dashboard', 800);
      } else {
        errEl.textContent = data.message || 'Invalid credentials. Please try again.';
        errEl.style.display = 'block';
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        btn.disabled = false;
      }
    } catch (err) {
      errEl.textContent = 'Connection error. Please try again.';
      errEl.style.display = 'block';
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      btn.disabled = false;
    }
  });

  // Redirect if already logged in
  const token = localStorage.getItem('jjg_token');
  if (token) {
    fetch('/api/auth/verify', { headers: { Authorization: 'Bearer ' + token } })
      .then(r => r.json())
      .then(d => { if (d.valid) window.location.href = '/admin/dashboard'; })
      .catch(() => {});
  }
</script>
</body>
</html>
